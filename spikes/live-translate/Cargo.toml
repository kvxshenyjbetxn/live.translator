[package]
name = "live-translate-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.16"
ctrlc = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
rpassword = "7"
rtrb = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
